# Dependencies
kramdown:
  input: GFM
highlighter:      rouge

# Permalinks
permalink:        pretty

# Setup
title:            "Robotics: Science and Systems"
tagline:          'A Robotics Conference'
description:      'RSS 2027, July 6, 2027 - July 11, 2027, Athens, Greece'
url:              "https://roboticsconference.org"
baseurl:          ""
include:          ['_pages']
exclude:          ['README.md', 'LICENSE.md', 'Gemfile', 'Gemfile.lock', '.travis.yml', 'vendor', 'GRTAGS', 'GPATH', 'GTAGS', 'deploy.sh', 'rss2027-preview', 'rss2027-preview*.zip', 'RSS 2027 Committees.xlsx']
logo:             "/images/rss2027-banner-preview.png"
favpng:           "/public/rss2027-favicon.png"
favicon:          "/public/rss2027-favicon.png"
apple_touch_icon: "/public/rss2027-favicon.png"
startdate:        "2027-07-06"
enddate:          "2027-07-11"
location:         "Athens, Greece"


author:
  name:           'Zehao Wang'
  url:            https://zehaowang983.github.io/

gems:             [jekyll-paginate]
paginate:         5
paginate_path:    "blog/page:num"

# Custom vars
# Hide the full navigation until the other conference pages are ready.
landing_page_only: true
version:          2.1.0

github:
  repo:

google_analytics: G-RCJTV6PJZC

collections:
    attending:
       output: false
       permalink: /attending/:path/
       priority: 2
    program:
       output: false
       permalink: /program/:path/
       priority: 2
    committees:
       output: true
       permalink: /committees/:path/
       priority: 4
    information:
       output: true
       permalink: /information/:path/
       priority: 3

defaults:
  -
    scope:
      path: ""
    values:
      priority: 0
